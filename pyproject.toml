[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loyalty-transfer-engine"
version = "0.1.0"
description = "Bi-directional loyalty points transfer engine (Optivoy Track 2)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Aakash Limbani" }]
# Runtime dependencies are pinned exactly so every environment runs the same code.
dependencies = [
    "fastapi==0.115.14",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "alembic==1.16.2",
    "redis==6.2.0",
    "httpx==0.28.1",
    "structlog==25.4.0",
    "prometheus-client==0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
    "pytest-cov==6.2.1",
    "hypothesis==6.135.26",
    "respx==0.22.0",
    "ruff==0.12.3",
    "mypy==1.16.1",
]

[tool.setuptools.packages.find]
include = ["app*", "partner_simulator*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "N",        # naming
    "ASYNC",    # async pitfalls (blocking calls in async code)
    "PT",       # pytest style
    "T20",      # no print()
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "partner_simulator", "scripts", "tests", "migrations/env.py"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests with no external services",
    "integration: tests that need PostgreSQL, Redis and the partner simulator",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's asyncio layer runs code inside greenlets; without this, coverage silently
# misses every line executed after an awaited database call.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# `make coverage` and CI fail below this. Services, domain and partners are each >= 85%.
fail_under = 90
