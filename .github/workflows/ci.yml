name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -m unit

  integration:
    name: Integration tests and coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loyalty
          POSTGRES_PASSWORD: loyalty
          POSTGRES_DB: loyalty
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loyalty -d loyalty"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://loyalty:loyalty@localhost:5432/loyalty
      REDIS_URL: redis://localhost:6379/0
      PARTNER_BASE_URL: http://localhost:8001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Start the partner simulator
        run: |
          nohup uvicorn partner_simulator.main:app --port 8001 > simulator.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8001/health && exit 0
            sleep 1
          done
          cat simulator.log
          exit 1
      - name: Tests with coverage (unit + integration)
        # Integration tests create and migrate their own `loyalty_test` database.
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore
      - name: Simulator log on failure
        if: failure()
        run: cat simulator.log

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime -t loyalty-engine:ci .
